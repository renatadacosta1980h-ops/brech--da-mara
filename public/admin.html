<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin · Brechó da Mara</title><link rel="stylesheet" href="/styles.css" /></head>
<body class="admin-body"><header class="topbar"><a class="brand" href="/"><span>BM</span> Brechó da Mara</a><a class="back-link" href="/">← Ver loja</a></header>
<main class="admin-main"><div class="admin-intro"><p class="eyebrow">PAINEL DA MARA</p><h1>Adicionar peça</h1><p>Escolha uma foto do seu computador, preencha os dados e ela aparece na loja na hora.</p></div>
<section class="admin-layout"><form id="product-form" class="product-form"><label class="image-upload" for="image"><input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp" required /><span class="upload-symbol">＋</span><strong>Enviar foto da peça</strong><small>JPG, PNG ou WEBP · até 4 MB</small><img id="image-preview" alt="Prévia da peça" hidden /></label><label>Nome da peça<input name="name" required maxlength="80" placeholder="Ex.: Blazer vermelho vintage" /></label><div class="form-row"><label>Tamanho<input name="size" maxlength="30" placeholder="Ex.: M" /></label><label>Preço (R$)<input name="price" required type="number" min="0.01" step="0.01" placeholder="0,00" /></label></div><label>Descrição<textarea name="description" maxlength="500" placeholder="Conte um pouco sobre a peça, estado, medidas..."></textarea></label><p class="form-message" id="form-message" role="status"></p><button class="save-button" type="submit">Publicar peça</button></form><section class="admin-products"><div class="section-heading"><div><p class="eyebrow">CATÁLOGO ATUAL</p><h2>Peças publicadas</h2></div></div><div id="admin-list" class="admin-list"></div></section></section></main><script src="/admin.js"></script></body></html>
