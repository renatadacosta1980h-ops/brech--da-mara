<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área da Mara — Brechó da Mara</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ---------- Tela de login ---------- -->
  <section id="tela-login" class="tela-login">
    <div class="cartao-login">
      <h1>Área da Mara</h1>
      <p class="sub">Entre para gerenciar o catálogo do brechó.</p>
      <div id="login-erro" class="erro-msg" style="display:none"></div>
      <form id="form-login">
        <div class="campo-grupo">
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" required autocomplete="username" />
        </div>
        <div class="campo-grupo">
          <label for="login-senha">Senha</label>
          <input id="login-senha" type="password" required autocomplete="current-password" />
        </div>
        <button class="botao botao-primario" type="submit" style="width:100%; justify-content:center; margin-top:6px;">Entrar</button>
      </form>
    </div>
  </section>

  <!-- ---------- Painel ---------- -->
  <section id="tela-painel" style="display:none">
    <header class="admin-topo">
      <a class="marca" href="index.html">
        <span class="marca-selo">BM</span>
        <span class="marca-nome">Brechó da <em>Mara</em></span>
      </a>
      <div style="display:flex; align-items:center; gap:16px;">
        <span id="email-usuario" style="font-size:13px; color:var(--papel-suave);"></span>
        <a class="botao botao-secundario" href="index.html" target="_blank">Ver catálogo</a>
        <button class="botao botao-secundario" id="btn-sair">Sair</button>
      </div>
    </header>

    <div class="admin-corpo">
      <div class="admin-cabecalho-secao">
        <h2>Peças cadastradas</h2>
        <button class="botao botao-primario" id="btn-novo-produto">+ Nova peça</button>
      </div>

      <table class="tabela-produtos">
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Tam.</th>
            <th>Preço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-produtos"></tbody>
      </table>
    </div>
  </section>

  <!-- ---------- Modal de peça ---------- -->
  <div id="sobreposicao-modal" class="sobreposicao" style="display:none">
    <div class="modal-produto">
      <h2 id="modal-titulo">Nova peça</h2>
      <div id="modal-erro" class="erro-msg" style="display:none"></div>
      <form id="form-produto">
        <div class="campo-grupo">
          <label for="campo-nome">Nome da peça</label>
          <input id="campo-nome" type="text" required placeholder="Ex.: Jaqueta jeans oversized" />
        </div>
        <div class="grade-dois">
          <div class="campo-grupo">
            <label for="campo-categoria">Categoria</label>
            <input id="campo-categoria" type="text" required placeholder="Ex.: Jaquetas" />
          </div>
          <div class="campo-grupo">
            <label for="campo-tamanho">Tamanho</label>
            <input id="campo-tamanho" type="text" required placeholder="Ex.: M" />
          </div>
        </div>
        <div class="campo-grupo">
          <label for="campo-preco">Preço (R$)</label>
          <input id="campo-preco" type="number" step="0.01" min="0" required placeholder="Ex.: 79.90" />
        </div>
        <div class="campo-grupo">
          <label for="campo-descricao">Descrição (opcional)</label>
          <textarea id="campo-descricao" rows="3" placeholder="Estado da peça, detalhes, medidas…"></textarea>
        </div>
        <div class="campo-grupo">
          <label for="campo-imagem">Foto</label>
          <input id="campo-imagem" type="file" accept="image/*" />
        </div>
        <div class="modal-acoes">
          <button type="button" class="botao botao-secundario" id="btn-cancelar-modal">Cancelar</button>
          <button type="submit" class="botao botao-primario">Salvar peça</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
